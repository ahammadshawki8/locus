name: locus-release-guard
purpose: Release guard. Roll production back to the last good revision when staging validation or the post-deploy smoke test fails.
stages: [Release, Monitor, Configure]
trigger:
  event: pipeline_failed
  condition: ref is `main` and the failed job is `validate-staging` or `post-deploy-smoke`
reads:
  - the validation / smoke report artifacts
  - the release manifest
  - deploy/gcp/production-revision and its git history (previous good revision)
allowed_paths:  # enforced by guard-scope
  - deploy/gcp/production-revision
actions:
  - open an MR that changes only deploy/gcp/production-revision to the last good revision (docs/contracts.md §7);
    it auto-merges when its pipeline passes
  - comment an incident note on the request issue and add label `incident`
instructions: |
  Explain in plain language what failed and why, citing the report. Never edit anything but the revision pointer.
  If no earlier good revision exists, do not guess: comment and ask for a human.
