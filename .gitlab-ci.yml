# Locus pipeline. The pipeline is the quality gate that decides whether a student ever gets a file.
#
# Only jobs that do real work live here (docs/decisions.md, 14 Oct 2026). Planned jobs (projectLocus.md §13) are added
# as each one is built:
#   validate-spec, license-check, auto-merge (hands-off mode),
#   publish-package, release, deploy-staging, validate-staging, approve-production (supervised only),
#   promote-production, post-deploy-smoke, reply-teacher, deploy-production-pointer, flow-config-check
# `release` needs touchcheck, guard-scope, guard-maths, guard-description, secret-detection, sast, license-check and
# bundle; `promote-production` needs validate-staging (docs/contracts.md §6).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build
  - test
  - secure
  - package
  - release
  - deploy
  - monitor

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # hands-off: a green graph/* MR is merged and released without a person (projectLocus.md §13, Configure).
  # supervised: the fallback, with one approval. Recorded in every bundle manifest (docs/contracts.md §5).
  RELEASE_MODE: "hands-off"

# Render every request (and the example) to STL + SVG + description + scene.json. The CLI also validates the spec,
# the layout and request.lock.json, so an invalid request fails here. Artifacts are kept even on failure.
render:
  stage: build
  image: node:20
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - node locus/cli/index.js examples/projectile.json --out out/example-projectile
    - |
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        node locus/cli/index.js "$dir" --out "out/$(basename "$dir")"
      done
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Touch-check every rendered request (docs/contracts.md §4, §6): TL-1 to TL-5 on out/<iid>/scene.json, writing
# touchcheck-report.json + overlay.svg and printing the report to the log after `LOCUS_REPORT ` (agents read job logs,
# not artifacts). A failing rule fails the job; the report and overlay are kept either way. The attempt number is the
# number of commits that changed the request's layout.json (attempt 1 = the intake agent's default layout).
# The example is checked too but does not gate the pipeline: it is the demo request at the default layout (print A),
# which fails on purpose (docs/decisions.md, 16 Oct 2026). A crash (exit > 1) still fails.
touchcheck:
  stage: test
  image: node:20
  needs:
    - job: render
      artifacts: true
  variables:
    GIT_DEPTH: 0 # full history, to count layout attempts
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - |
      code=0
      node locus/cli/index.js touchcheck examples/projectile.json --out out/example-projectile || code=$?
      if [ "$code" -gt 1 ]; then exit "$code"; fi
      if [ "$code" -eq 1 ]; then echo "example-projectile: failed touchcheck as expected (print A); not a gate"; fi
    - |
      status=0
      checked=0
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        checked=$((checked + 1))
        attempt=$(git rev-list --count HEAD -- "${dir}layout.json")
        [ "$attempt" -ge 1 ] || attempt=1
        node locus/cli/index.js touchcheck "$dir" --out "out/$(basename "$dir")" --attempt "$attempt" || status=1
      done
      echo "touchcheck: ${checked} request(s) checked"
      exit "$status"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/*/touchcheck-report.json
      - out/*/overlay.svg
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Guards (projectLocus.md §11, docs/contracts.md §7). Deterministic; a guard that cannot check (no base commit, missing
# render output) exits 2 and fails the job. Each writes out/guards/*.json for the bundle job's manifest.
.guard:
  stage: secure
  image: node:20
  variables:
    GIT_DEPTH: 0 # full history: commit authors, lock history
  cache:
    key: npm-locus
    paths:
      - .npm/
  before_script:
    - npm --prefix locus ci
    # the default branch, for branch pipelines that have no MR diff base
    - git fetch -q origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}" || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/guards/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Every agent commit since the base stays in its agent's allowed paths and branch (commit author = flow service account).
guard-scope:
  extends: .guard
  needs: []
  script:
    - node locus/cli/index.js guard scope

# Every request: spec equals request.lock.json, the lock was written once, and what was rendered lies on the locked maths.
guard-maths:
  extends: .guard
  needs:
    - job: render
      artifacts: true
  script:
    - |
      status=0
      checked=0
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        checked=$((checked + 1))
        node locus/cli/index.js guard maths "$dir" --out "out/$(basename "$dir")" || status=1
      done
      echo "guard-maths: ${checked} request(s) checked"
      exit "$status"

# Every request: every number in the learner description is a computed value.
guard-description:
  extends: .guard
  needs:
    - job: render
      artifacts: true
  script:
    - |
      status=0
      checked=0
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        checked=$((checked + 1))
        node locus/cli/index.js guard description "$dir" --out "out/$(basename "$dir")" || status=1
      done
      echo "guard-description: ${checked} request(s) checked"
      exit "$status"

# The regression detective's revert/<sha> MR holds one commit that is exactly the inverse of <sha>: the same paths,
# each back to its content before <sha>, none changed since (projectLocus.md §11). guard-scope checks author and paths.
guard-revert:
  extends: .guard
  needs: []
  script:
    - node locus/cli/index.js guard revert
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^revert\//
    - if: $CI_COMMIT_BRANCH =~ /^revert\//

# Re-check every shipped graph (the newest release tag graph-<iid>-v<n> of each request, from the request files at that
# tag) with this pipeline's code: render + touchcheck (docs/contracts.md §6). Needs full history and the release tags.
.monitor:
  image: node:20
  variables:
    GIT_DEPTH: 0
  cache:
    key: npm-locus
    paths:
      - .npm/
  before_script:
    - npm --prefix locus ci
    - git fetch -q origin "+refs/tags/graph-*:refs/tags/graph-*" || true

# Impact reviewer's input: on an MR that changes generator code or dependencies, which shipped graphs would fail with
# the MR's code. out/impact/report.json + `LOCUS_IMPACT` log line; a failing graph fails the job, before any merge.
library-impact:
  extends: .monitor
  stage: test
  needs: []
  script:
    - node locus/cli/index.js recheck --impact
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/impact/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - locus/core/**/*
        - packages/**/*
        - package.json
        - package-lock.json
        - locus/package.json
        - locus/package-lock.json

# On main (pushes and the nightly schedule): do all shipped graphs still pass with main's code?
# out/recheck/report.json + `LOCUS_RECHECK` log line; a failing graph fails the job, which starts bisect-regression.
# With JUDGING_FREEZE=true it only logs: a failure does not fail the pipeline, so no flow starts (projectLocus.md §14).
library-recheck:
  extends: .monitor
  stage: monitor
  needs: []
  script:
    - node locus/cli/index.js recheck
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/recheck/
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $JUDGING_FREEZE == "true"
      allow_failure: true
    - when: on_success

# After library-recheck fails: for each failing graph, the first commit since its release with which it fails
# (git bisect run in a separate worktree; each step renders and touch-checks with that commit's own code).
# out/bisect/report.json + `LOCUS_BISECT` log line, for the regression detective (revert/<sha>, guard-revert).
bisect-regression:
  extends: .monitor
  stage: monitor
  needs:
    - job: library-recheck
      artifacts: true
  script:
    - node locus/cli/index.js bisect
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/bisect/report.json
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $JUDGING_FREEZE == "true"
      when: never
    - when: on_failure

# Bundle every request that passed (docs/contracts.md §3, §5, §6): out/bundle/graph-<iid>-v<n>/ + .zip, with
# manifest.json built only from the render, touchcheck and guard-* outputs above. Runs only when all of those passed.
# <n> is one more than the newest release tag graph-<iid>-v<n>; a request unchanged since its last release is skipped.
# The CLI refuses (exit 1) a request whose touchcheck or guards failed, and fails closed (exit 2) on missing input.
bundle:
  stage: package
  image: node:20
  needs:
    - job: render
      artifacts: true
    - job: touchcheck
      artifacts: true
    - job: guard-scope
      artifacts: true
    - job: guard-maths
      artifacts: true
    - job: guard-description
      artifacts: true
  variables:
    GIT_DEPTH: 0 # full history: release tags and the request folder's history
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - git fetch -q origin "+refs/tags/graph-*:refs/tags/graph-*" || true
    - |
      status=0
      checked=0
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        checked=$((checked + 1))
        node locus/cli/index.js bundle "$dir" --out "out/$(basename "$dir")" || status=1
      done
      echo "bundle: ${checked} request(s) checked"
      exit "$status"
  # 90 days: the pass note links these files (docs/decisions.md 20 Oct (d)), and they must outlive judging.
  artifacts:
    expire_in: 90 days
    paths:
      - out/bundle/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Migrated from upstream .github/workflows/node.yml (Node 20/22 matrix, same commands).
upstream-test:
  stage: test
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]
  cache:
    key: npm-upstream-$NODE_VERSION
    paths:
      - .npm/
  script:
    - npm install
    - npm test
    - npm run test:tsd
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - packages/**/*
        - package.json
        - package-lock.json
        - lerna.json

# Locus unit + contract tests (schemas, fixtures, remedies, profiles, rollback pointer format), including the
# reproduction of prototype prints A, B and C (docs/contracts.md D3).
locus-test:
  stage: test
  image: node:20
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - npm run test:locus
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
