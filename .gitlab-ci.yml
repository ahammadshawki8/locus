# Locus pipeline. The pipeline is the quality gate that decides whether a student ever gets a file.
#
# Only jobs that do real work live here (docs/decisions.md, 14 Oct 2026). Planned jobs (projectLocus.md §13) are added
# as each one is built:
#   validate-spec, approve-production (supervised only), flow-config-check
# deploy-production-pointer is part of promote-production: every default-branch pipeline applies
# deploy/gcp/production-revision (docs/decisions.md 20 Oct (i)).
# `release` needs touchcheck, guard-scope, guard-maths, guard-description, secret-detection, sast, license-check and
# bundle; `promote-production` needs validate-staging (docs/contracts.md §6).

workflow:
  rules:
    # The reprints schedule (every 30 minutes, variable LOCUS_SCHEDULE=reprints) runs print-reprints only: no scans.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $LOCUS_SCHEDULE == "reprints"
      variables:
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build
  - test
  - secure
  - package
  - release
  - deploy
  - monitor

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # hands-off: a green graph/* MR is merged and released without a person (projectLocus.md §13, Configure).
  # supervised: the fallback, with one approval. Recorded in every bundle manifest (docs/contracts.md §5).
  RELEASE_MODE: "hands-off"
  # Google Cloud (deploy/gcp/setup.sh prints these; none is a secret). The deploy jobs exist only once they are set.
  GCP_PROJECT_ID: "locus-tactile-2026"
  GCP_REGION: "us-central1"
  GCP_WIF_PROVIDER: "projects/742642312166/locations/global/workloadIdentityPools/gitlab/providers/gitlab-com"
  GCP_SERVICE_ACCOUNT: "locus-deploy@locus-tactile-2026.iam.gserviceaccount.com"
  # The live site, for links in print orders sent outside a release pipeline (print-reprints).
  LOCUS_SITE_URL: "https://locus-site-742642312166.us-central1.run.app"

# Render every request (and the example) to STL + SVG + description + scene.json. The CLI also validates the spec,
# the layout and request.lock.json, so an invalid request fails here. Artifacts are kept even on failure.
render:
  stage: build
  image: node:20
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - node locus/cli/index.js examples/projectile.json --out out/example-projectile
    - |
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        node locus/cli/index.js "$dir" --out "out/$(basename "$dir")"
      done
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Touch-check every rendered request (docs/contracts.md §4, §6): TL-1 to TL-5 on out/<iid>/scene.json, writing
# touchcheck-report.json + overlay.svg and printing the report to the log after `LOCUS_REPORT ` (agents read job logs,
# not artifacts). A failing rule fails the job; the report and overlay are kept either way. The attempt number is the
# number of commits that changed the request's layout.json (attempt 1 = the intake agent's default layout).
# The example is checked too but does not gate the pipeline: it is the demo request at the default layout (print A),
# which fails on purpose (docs/decisions.md, 16 Oct 2026). A crash (exit > 1) still fails.
touchcheck:
  stage: test
  image: node:20
  needs:
    - job: render
      artifacts: true
  variables:
    GIT_DEPTH: 0 # full history, to count layout attempts
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - |
      code=0
      node locus/cli/index.js touchcheck examples/projectile.json --out out/example-projectile || code=$?
      if [ "$code" -gt 1 ]; then exit "$code"; fi
      if [ "$code" -eq 1 ]; then echo "example-projectile: failed touchcheck as expected (print A); not a gate"; fi
    - |
      status=0
      checked=0
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        checked=$((checked + 1))
        attempt=$(git rev-list --count HEAD -- "${dir}layout.json")
        [ "$attempt" -ge 1 ] || attempt=1
        node locus/cli/index.js touchcheck "$dir" --out "out/$(basename "$dir")" --attempt "$attempt" || status=1
      done
      echo "touchcheck: ${checked} request(s) checked"
      exit "$status"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/*/touchcheck-report.json
      - out/*/overlay.svg
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Guards (projectLocus.md §11, docs/contracts.md §7). Deterministic; a guard that cannot check (no base commit, missing
# render output) exits 2 and fails the job. Each writes out/guards/*.json for the bundle job's manifest.
.guard:
  stage: secure
  image: node:20
  variables:
    GIT_DEPTH: 0 # full history: commit authors, lock history
  cache:
    key: npm-locus
    paths:
      - .npm/
  before_script:
    - npm --prefix locus ci
    # the default branch, for branch pipelines that have no MR diff base
    - git fetch -q origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}" || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/guards/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Every agent commit since the base stays in its agent's allowed paths and branch (commit author = flow service account).
guard-scope:
  extends: .guard
  needs: []
  script:
    - node locus/cli/index.js guard scope

# Every request: spec equals request.lock.json, the lock was written once, and what was rendered lies on the locked maths.
guard-maths:
  extends: .guard
  needs:
    - job: render
      artifacts: true
  script:
    - |
      status=0
      checked=0
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        checked=$((checked + 1))
        node locus/cli/index.js guard maths "$dir" --out "out/$(basename "$dir")" || status=1
      done
      echo "guard-maths: ${checked} request(s) checked"
      exit "$status"

# Every request: every number in the learner description is a computed value.
guard-description:
  extends: .guard
  needs:
    - job: render
      artifacts: true
  script:
    - |
      status=0
      checked=0
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        checked=$((checked + 1))
        node locus/cli/index.js guard description "$dir" --out "out/$(basename "$dir")" || status=1
      done
      echo "guard-description: ${checked} request(s) checked"
      exit "$status"

# The regression detective's revert/<sha> MR holds one commit that is exactly the inverse of <sha>: the same paths,
# each back to its content before <sha>, none changed since (projectLocus.md §11). guard-scope checks author and paths.
guard-revert:
  extends: .guard
  needs: []
  script:
    - node locus/cli/index.js guard revert
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^revert\//
    - if: $CI_COMMIT_BRANCH =~ /^revert\//

# Re-check every shipped graph (the newest release tag graph-<iid>-v<n> of each request, from the request files at that
# tag) with this pipeline's code: render + touchcheck (docs/contracts.md §6). Needs full history and the release tags.
.monitor:
  image: node:20
  variables:
    GIT_DEPTH: 0
  cache:
    key: npm-locus
    paths:
      - .npm/
  before_script:
    - npm --prefix locus ci
    - git fetch -q origin "+refs/tags/graph-*:refs/tags/graph-*" || true

# Impact reviewer's input: on an MR that changes generator code or dependencies, which shipped graphs would fail with
# the MR's code. out/impact/report.json + `LOCUS_IMPACT` log line; a failing graph fails the job, before any merge.
library-impact:
  extends: .monitor
  stage: test
  needs: []
  script:
    - node locus/cli/index.js recheck --impact
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/impact/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - locus/core/**/*
        - packages/**/*
        - package.json
        - package-lock.json
        - locus/package.json
        - locus/package-lock.json

# On main (pushes and the nightly schedule): do all shipped graphs still pass with main's code?
# out/recheck/report.json + `LOCUS_RECHECK` log line; a failing graph fails the job, which starts bisect-regression.
# With JUDGING_FREEZE=true it only logs: a failure does not fail the pipeline, so no flow starts (projectLocus.md §14).
library-recheck:
  extends: .monitor
  stage: monitor
  needs: []
  script:
    - node locus/cli/index.js recheck
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/recheck/
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $LOCUS_SCHEDULE == "reprints"
      when: never
    - if: $JUDGING_FREEZE == "true"
      allow_failure: true
    - when: on_success

# After library-recheck fails: for each failing graph, the first commit since its release with which it fails
# (git bisect run in a separate worktree; each step renders and touch-checks with that commit's own code).
# out/bisect/report.json + `LOCUS_BISECT` log line, for the regression detective (revert/<sha>, guard-revert).
bisect-regression:
  extends: .monitor
  stage: monitor
  needs:
    - job: library-recheck
      artifacts: true
  script:
    - node locus/cli/index.js bisect
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/bisect/report.json
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $LOCUS_SCHEDULE == "reprints"
      when: never
    - if: $JUDGING_FREEZE == "true"
      when: never
    - when: on_failure

# Bundle every request that passed (docs/contracts.md §3, §5, §6): out/bundle/graph-<iid>-v<n>/ + .zip, with
# manifest.json built only from the render, touchcheck and guard-* outputs above. Runs only when all of those passed.
# <n> is one more than the newest release tag graph-<iid>-v<n>; a request unchanged since its last release is skipped.
# The CLI refuses (exit 1) a request whose touchcheck or guards failed, and fails closed (exit 2) on missing input.
bundle:
  stage: package
  image: node:20
  needs:
    - job: render
      artifacts: true
    - job: touchcheck
      artifacts: true
    - job: guard-scope
      artifacts: true
    - job: guard-maths
      artifacts: true
    - job: guard-description
      artifacts: true
  variables:
    GIT_DEPTH: 0 # full history: release tags and the request folder's history
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - git fetch -q origin "+refs/tags/graph-*:refs/tags/graph-*" || true
    - |
      status=0
      checked=0
      for dir in requests/*/; do
        [ -f "${dir}spec.json" ] || continue
        checked=$((checked + 1))
        node locus/cli/index.js bundle "$dir" --out "out/$(basename "$dir")" || status=1
      done
      echo "bundle: ${checked} request(s) checked"
      exit "$status"
  # 90 days: the pass note links these files (docs/decisions.md 20 Oct (d)), and they must outlive judging.
  artifacts:
    expire_in: 90 days
    paths:
      - out/bundle/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Migrated from upstream .github/workflows/node.yml (Node 20/22 matrix, same commands).
upstream-test:
  stage: test
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]
  cache:
    key: npm-upstream-$NODE_VERSION
    paths:
      - .npm/
  script:
    - npm install
    - npm test
    - npm run test:tsd
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - packages/**/*
        - package.json
        - package-lock.json
        - lerna.json

# Locus unit + contract tests (schemas, fixtures, remedies, profiles, rollback pointer format), including the
# reproduction of prototype prints A, B and C (docs/contracts.md D3).
locus-test:
  stage: test
  image: node:20
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - npm run test:locus
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # The locus-request session waits for each graph/<iid> pipeline, and the whole suite took 3 to 4 minutes of an
    # attempt's 4 (docs/decisions.md 21 Oct (f)). Such an MR changes only request files (guard-scope), so the tests run
    # there only when code changed too. Every main pipeline still runs them.
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^graph\//
      changes:
        - locus/**/*
        - packages/**/*
        - profiles/**/*
        - package.json
        - package-lock.json
        - .gitlab-ci.yml
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^graph\//
      when: never
    - when: on_success

# Every runtime dependency of Locus carries a permissive licence (release/license.js). `release` needs it.
license-check:
  stage: secure
  image: node:20
  needs: []
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - node locus/cli/index.js license-check
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/license/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Hands-off: on a graph/<iid> MR whose checks all passed, ask GitLab to merge it when the whole pipeline succeeds
# (release/auto-merge.js; contracts D7). GitLab's "Pipelines must succeed" check makes the final decision. A failure
# here only warns, so it never reads to the fixer as a touch-check failure; the MR then waits for a person.
auto-merge:
  stage: release
  image: node:20
  needs:
    - touchcheck
    - guard-scope
    - guard-maths
    - guard-description
    - bundle
    - license-check
    - job: locus-test
      optional: true # not run on a graph MR that changes no code
  cache:
    key: npm-locus
    paths:
      - .npm/
  script:
    - npm --prefix locus ci
    - node locus/cli/index.js auto-merge
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^graph\//

# Default branch only, outside the judging freeze: package, release, site, Cloud Run, reply.
.ship:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $JUDGING_FREEZE == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.ship-gcp:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $JUDGING_FREEZE == "true"
      when: never
    - if: $GCP_PROJECT_ID == "" || $GCP_WIF_PROVIDER == "" || $GCP_SERVICE_ACCOUNT == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.node-job:
  image: node:20
  cache:
    key: npm-locus
    paths:
      - .npm/
  before_script:
    - npm --prefix locus ci

# Each new bundle into the generic Package Registry as locus-graphs/graph-<iid>-v<n>/ (release/release.js).
publish-package:
  extends: [.node-job, .ship]
  stage: package
  needs:
    - job: bundle
      artifacts: true
  script:
    - node locus/cli/index.js publish-package out/bundle

# Tag graph-<iid>-v<n> and a GitLab release linking the package files (contracts §6: every check must have passed).
release:
  extends: [.node-job, .ship]
  stage: release
  needs:
    - job: touchcheck
    - job: guard-scope
    - job: guard-maths
    - job: guard-description
    - job: secret_detection
    - job: semgrep-sast
    - job: license-check
    - job: bundle
      artifacts: true
    - job: publish-package
  script:
    - node locus/cli/index.js release out/bundle out/release
  artifacts:
    expire_in: 90 days
    paths:
      - out/release/

# The graph library: every shipped graph's released files, from the Package Registry (site/build.js).
site:
  extends: [.node-job, .ship-gcp]
  stage: deploy
  needs:
    - job: release
  script:
    - node locus/cli/index.js site --out out/site
  artifacts:
    expire_in: 30 days
    paths:
      - out/site/

# A new Cloud Run revision with no production traffic, tagged staging (deploy/gcp/deploy.sh).
deploy-staging:
  extends: .ship-gcp
  stage: deploy
  image: google/cloud-sdk:slim
  needs:
    - job: site
      artifacts: true
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER
  script:
    - bash deploy/gcp/deploy.sh staging
  # Cloud Build can end a finished build with INTERNAL_ERROR (21 Oct: image pushed, then the error); one retry.
  retry:
    max: 1
    when: script_failure
  artifacts:
    reports:
      dotenv: deploy.env

# Staging serves this commit's build, every graph page loads, every file matches its manifest hash (site/validate.js).
validate-staging:
  extends: [.node-job, .ship-gcp]
  stage: deploy
  needs:
    - job: deploy-staging
      artifacts: true
  script:
    - node locus/cli/index.js validate-site "$STAGING_URL" --expect-commit "$CI_COMMIT_SHA" --name validate-staging
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/validate-staging/

# Production gets the validated revision, unless deploy/gcp/production-revision pins it (rollback).
promote-production:
  extends: .ship-gcp
  stage: deploy
  image: google/cloud-sdk:slim
  needs:
    - job: deploy-staging
      artifacts: true
    - job: validate-staging
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER
  script:
    - bash deploy/gcp/deploy.sh promote
  artifacts:
    reports:
      dotenv: promote.env

# The same checks on production, after the traffic moved.
post-deploy-smoke:
  extends: [.node-job, .ship-gcp]
  stage: monitor
  needs:
    - job: promote-production
      artifacts: true
  script:
    - |
      if [ "$PROMOTED" = "true" ]; then expect="--expect-commit $CI_COMMIT_SHA"; else expect=""; fi
      node locus/cli/index.js validate-site "$PRODUCTION_URL" $expect --name post-deploy-smoke
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/post-deploy-smoke/

# The contracts §8 note on each released request, then the request is closed (release/reply.js).
reply-teacher:
  extends: [.node-job, .ship-gcp]
  stage: monitor
  needs:
    - job: release
      artifacts: true
    - job: promote-production
      artifacts: true
    - job: post-deploy-smoke
  script:
    - |
      if [ "$PROMOTED" != "true" ]; then echo "reply-teacher: production is pinned by deploy/gcp/production-revision; no reply until it serves this release"; exit 0; fi
      node locus/cli/index.js reply-teacher "$PRODUCTION_URL" out/release

# Optional print order (docs/decisions.md 21 Oct (l)): emails the print shop each released graph with the STL attached.
# Off unless PRINT_ORDER_ENABLED is "true"; the sender's app password is the masked CI variable PRINT_ORDER_SMTP_PASSWORD.
print-order:
  extends: .node-job
  stage: monitor
  needs:
    - job: release
      artifacts: true
    - job: bundle
      artifacts: true
    - job: promote-production
      artifacts: true
    - job: reply-teacher
  script:
    - |
      if [ "$PROMOTED" != "true" ]; then echo "print-order: production is pinned by deploy/gcp/production-revision; no order until it serves this release"; exit 0; fi
      node locus/cli/index.js print-order "$PRODUCTION_URL" out/release out/bundle
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $JUDGING_FREEZE == "true"
      when: never
    - if: $PRINT_ORDER_ENABLED != "true"
      when: never
    - if: $GCP_PROJECT_ID == "" || $GCP_WIF_PROVIDER == "" || $GCP_SERVICE_ACCOUNT == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Reprints (docs/decisions.md 21 Oct (n)): the open `reprint` issues teachers send from a graph page's "Print again",
# ordered from the school's print shop, noted and closed. Only on the reprints schedule, and only when print orders
# are on; never during the judging freeze.
print-reprints:
  extends: .node-job
  stage: monitor
  needs: []
  script:
    - node locus/cli/index.js print-reprints
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" || $LOCUS_SCHEDULE != "reprints"
      when: never
    - if: $JUDGING_FREEZE == "true" || $PRINT_ORDER_ENABLED != "true"
      when: never
    - when: on_success
