<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Locus">
  <title>Locus</title>
  <!-- A locus is the set of points that follow a rule: five raised dots along an arch, the vertex marked larger. -->
  <rect width="32" height="32" rx="8" fill="#121212"/>
  <g fill="#ece9e1">
    <circle cx="6" cy="23.5" r="2.4"/>
    <circle cx="10.6" cy="14.6" r="2.4"/>
    <circle cx="16" cy="10.5" r="3.3"/>
    <circle cx="21.4" cy="14.6" r="2.4"/>
    <circle cx="26" cy="23.5" r="2.4"/>
  </g>
</svg>
